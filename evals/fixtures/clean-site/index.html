<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Example Project</title>
  <meta name="description" content="This is a clean and fully compliant website demonstration for benchmarking without issues.">
  <link rel="canonical" href="https://example.com/">
  <meta property="og:title" content="Clean Example Project">
  <meta property="og:description" content="This is a clean and fully compliant website demonstration for benchmarking without issues.">
  <link rel="stylesheet" href="styles.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Clean Example",
    "url": "https://example.com/"
  }
  </script>
</head>
<body>
  <header>
    <h1>Clean Example Project</h1>
  </header>
  <main id="content">
    <p>Welcome to our accessible website with clean code and no audit violations.</p>
    <img src="logo.png" alt="Clean Project Logo" width="200" height="60">
    <form action="/search" method="get">
      <label for="search-box">Search query</label>
      <input id="search-box" name="q" type="search">
      <button type="submit">Search</button>
    </form>
    <button type="button" class="btn">Explore</button>
  </main>

</html>
